name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    name: ${{ matrix.scope }} / ${{ matrix.check }}
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ matrix.scope }}-${{ matrix.check }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Global checks (lint/type/test across apps and packages via root config)
          - scope: global
            check: lint
            command: npm run lint
          - scope: global
            check: typecheck
            command: npm run typecheck
          - scope: global
            check: test
            command: npm run test

          - scope: global
            check: build
            command: npm run build

          # Targeted checks for standalone runtimes
          - scope: cli
            check: test
            command: ./node_modules/.bin/vitest run apps/cli

          - scope: worker
            check: lint
            command: npm --prefix apps/worker run lint
          - scope: worker
            check: typecheck
            command: npm --prefix apps/worker run typecheck
          - scope: worker
            check: test
            command: npm --prefix apps/worker run test

          - scope: mcp-gateway
            check: lint
            command: npm --prefix apps/mcp-gateway run lint
          - scope: mcp-gateway
            check: typecheck
            command: npm --prefix apps/mcp-gateway run typecheck
          - scope: mcp-gateway
            check: test
            command: npm --prefix apps/mcp-gateway run test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/worker/package-lock.json
            apps/mcp-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - run: ${{ matrix.command }}

  browser-parity:
    name: browser / capability-parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Studio parity checks
        run: npx --yes playwright@1.59.1 install chromium

      - name: Start Studio server
        run: |
          npm run dev -- --host 127.0.0.1 --port 5180 > /tmp/cadlad-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5180/viewer.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cadlad-vite.log
          exit 1

      - name: Compare browser and shared-runtime capability results
        run: |
          chrome_path="$(find "$HOME/.cache/ms-playwright" -type f -name chrome | head -1)"
          test -n "$chrome_path"
          CHROME_PATH="$chrome_path" npm run test:browser -- --url http://127.0.0.1:5180
